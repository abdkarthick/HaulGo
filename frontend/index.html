<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3A3541" />
    <title>HaulGo · Industrial Transport. Simplified.</title>
    <meta name="description" content="HaulGo - Book mini trucks, tempos & industrial transport in Chennai, Kanchipuram in 2 mins. Transparent fare, verified drivers, live tracking." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://haulgo-1.onrender.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- MSG91 CAPTCHA - ithu kandippa venum -->
    <div id="msg91-captcha"></div>

    <!-- MSG91 OTP WIDGET -->
    <script src="https://verify.msg91.com/otp-provider.js"></script>
    <script type="text/javascript">
      var configuration = {
        widgetId: "366b7a6a6865393631313735",
        tokenAuth: "593846TohBxZlK6b080557P1",

        exposeMethods: true,
        captchaRenderId: "msg91-captcha",
        success: function (data) {
          console.log('success response', data);
          window.dispatchEvent(new CustomEvent("msg91-verified", { detail: data }));
          window.dispatchEvent(new Event("msg91-verified"));
        },
        failure: function (error) {
          console.log('failure reason', error);
        }
      };
      window.addEventListener('load', function () {
        if (typeof window.initSendOTP === 'function') {
          window.initSendOTP(configuration);
        }
      });
    </script>
  </body>
</html>
